<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>열차 기호 시안</title>
<!-- 지도 위 열차 기호 시안: 실제 크기(확대 없음). 지금 / A 캡슐 / B 편성 / C 배지, 종이·먹 -->
<style>
  body { margin: 0; padding: 20px; background: #2b2d30; color: #ddd; font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 6px; } p { font-size: 13px; color: #aaa; margin: 0 0 14px; max-width: 900px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(2, 420px); gap: 14px 18px; }
  .card h2 { font-size: 13px; margin: 0 0 6px; color: #eee; } .card h2 small { color: #aaa; font-weight: 400; }
  svg { display: block; width: 420px; height: 200px; border-radius: 10px; }
  .paper { --g:#ECE9E1; --w:#C6D3D9; --s:#FBFAF6; --k:#15171A; --k2:#6B7076; }
  .ink { --g:#17191C; --w:#1F2B33; --s:#121416; --k:#ECEAE3; --k2:#8C8981; }
  .bg { fill: var(--g); } .water { fill: none; stroke: var(--w); stroke-width: 26; }
  .casing { fill: none; stroke: var(--s); stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
  .line { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .st { fill: var(--s); stroke: var(--k); stroke-width: 2.5; }
  .lbl { font: 800 11px sans-serif; fill: var(--k); paint-order: stroke; stroke: var(--s); stroke-width: 3; }
  .note { font: 600 10px sans-serif; fill: var(--k2); }
</style>
</head>
<body>
<h1>지하철(열차) 기호 시안 — 지도 위 실제 크기</h1>
<p>지금 기호는 진행 방향과 상관없이 항상 세로로 서 있고, 급행만 삼각 표식이 붙습니다. 아래 A·B는 선로 방향으로 눕혀 달리는 모습, C는 회전하지 않는 노선 배지형입니다. 각 칸에서 일반·급행·혼잡 열차를 함께 보여 줍니다. 위쪽은 종이 테마, 아래쪽은 먹 테마입니다.</p>

<svg id="map" style="display:none" aria-hidden="true"><g>
  <rect class="bg" width="420" height="200"/>
  <path class="water" d="M-10 170 C 120 140 260 190 430 150"/>
  <path class="casing" d="M20 60 H 200 L 280 140 H 410"/><path class="line" stroke="#1D5FC2" d="M20 60 H 200 L 280 140 H 410"/>
  <path class="casing" d="M120 190 V 110 L 190 40 H 410"/><path class="line" stroke="#1E8A47" d="M120 190 V 110 L 190 40 H 410"/>
  <circle class="st" cx="60" cy="60" r="6"/><circle class="st" cx="200" cy="60" r="6"/><circle class="st" cx="340" cy="140" r="6"/><circle class="st" cx="150" cy="80" r="8"/><circle class="st" cx="330" cy="40" r="6"/>
  <text class="lbl" x="48" y="48">시청</text><text class="lbl" x="326" y="160">잠실</text>
</g></svg>

<div class="grid">
  <!-- 0. 지금 -->
  <div class="card paper"><h2>지금 <small>세로로 선 차체, 방향 없음</small></h2>
    <svg viewBox="0 0 420 200" data-map>
      <g transform="translate(110 60)"><rect x="-9" y="-12" width="18" height="24" rx="5" fill="#1D5FC2" stroke="var(--s)" stroke-width="2"/><rect x="-10.5" y="-13.5" width="21" height="27" rx="6" fill="none" stroke="var(--k)" stroke-width="1.5"/><rect x="-6" y="-8" width="12" height="7" rx="2" fill="var(--s)"/></g>
      <g transform="translate(240 100)"><rect x="-9" y="-12" width="18" height="24" rx="5" fill="#1D5FC2" stroke="var(--s)" stroke-width="2"/><rect x="-10.5" y="-13.5" width="21" height="27" rx="6" fill="none" stroke="var(--k)" stroke-width="1.5"/><rect x="-6" y="-8" width="12" height="7" rx="2" fill="var(--s)"/><path d="M-6 -17 H6 L0 -23 Z" fill="var(--k)"/></g>
      <g transform="translate(260 40)"><rect x="-9" y="-12" width="18" height="24" rx="5" fill="#1E8A47" stroke="var(--s)" stroke-width="2"/><rect x="-10.5" y="-13.5" width="21" height="27" rx="6" fill="none" stroke="var(--k)" stroke-width="1.5"/><rect x="-6" y="-8" width="12" height="7" rx="2" fill="var(--s)"/></g>
      <text class="note" x="10" y="192">일반 · 급행(▲) · 2호선 — 방향·혼잡 표현 없음</text>
    </svg>
  </div>

  <!-- A. 캡슐 -->
  <div class="card paper"><h2>A. 캡슐 <small>선로 방향으로 회전, 앞머리로 진행 방향</small></h2>
    <svg viewBox="0 0 420 200" data-map>
      <!-- 일반: 노선 색 캡슐 + 바탕색 테두리 + 앞쪽 먹 머리 -->
      <g transform="translate(110 60)"><rect x="-13" y="-5.5" width="26" height="11" rx="5.5" fill="#1D5FC2" stroke="var(--s)" stroke-width="2"/><rect x="-14.5" y="-7" width="29" height="14" rx="7" fill="none" stroke="var(--k)" stroke-width="1.5"/><path d="M6 -4 A 5 4 0 0 1 6 4 Z" fill="var(--k)"/></g>
      <!-- 급행: 먹 띠 두 줄 -->
      <g transform="translate(240 100) rotate(45)"><rect x="-13" y="-5.5" width="26" height="11" rx="5.5" fill="#1D5FC2" stroke="var(--s)" stroke-width="2"/><rect x="-14.5" y="-7" width="29" height="14" rx="7" fill="none" stroke="var(--k)" stroke-width="1.5"/><path d="M6 -4 A 5 4 0 0 1 6 4 Z" fill="var(--k)"/><path d="M-6 -5 V5 M-2 -5 V5" stroke="var(--k)" stroke-width="2"/></g>
      <!-- 혼잡: 꼬리에 ! 표식 -->
      <g transform="translate(260 40) rotate(180)"><rect x="-13" y="-5.5" width="26" height="11" rx="5.5" fill="#1E8A47" stroke="var(--s)" stroke-width="2"/><rect x="-14.5" y="-7" width="29" height="14" rx="7" fill="none" stroke="var(--k)" stroke-width="1.5"/><path d="M6 -4 A 5 4 0 0 1 6 4 Z" fill="var(--k)"/></g>
      <g transform="translate(260 22)"><path d="M0 -7 L7 5 H-7 Z" fill="#F2BE00" stroke="var(--k)" stroke-width="1.2"/><text x="-1.6" y="3.5" font-size="8" font-weight="900" fill="#15171A">!</text></g>
      <text class="note" x="10" y="192">일반(→) · 급행(먹 띠) · 혼잡(△!) — 가장 간결, 줌아웃에도 읽힘</text>
    </svg>
  </div>

  <!-- B. 편성 -->
  <div class="card paper"><h2>B. 편성 <small>객차 칸 수 = 실제 편성 길이</small></h2>
    <svg viewBox="0 0 420 200" data-map>
      <g transform="translate(105 60)"><g fill="#1D5FC2" stroke="var(--k)" stroke-width="1.3"><rect x="-21" y="-5" width="12" height="10" rx="2"/><rect x="-7" y="-5" width="12" height="10" rx="2"/><path d="M7 -5 H15 Q21 -5 21 0 Q21 5 15 5 H7 Z"/></g><path d="M16 -3 Q19 0 16 3" stroke="var(--s)" stroke-width="1.5" fill="none"/></g>
      <g transform="translate(240 100) rotate(45)"><g fill="#1D5FC2" stroke="var(--k)" stroke-width="1.3"><rect x="-28" y="-5" width="12" height="10" rx="2"/><rect x="-14" y="-5" width="12" height="10" rx="2"/><rect x="0" y="-5" width="12" height="10" rx="2"/><path d="M14 -5 H22 Q28 -5 28 0 Q28 5 22 5 H14 Z"/></g><path d="M-26 0 H26" stroke="var(--k)" stroke-width="1.5"/></g>
      <g transform="translate(262 40) rotate(180)"><g fill="#1E8A47" stroke="var(--k)" stroke-width="1.3"><rect x="-14" y="-5" width="12" height="10" rx="2"/><path d="M0 -5 H8 Q14 -5 14 0 Q14 5 8 5 H0 Z"/></g></g>
      <text class="note" x="10" y="192">6량(3칸) · 급행 8량(4칸+가운데 먹 줄) · 4량(2칸) — 가장 기차답지만 겹치면 복잡</text>
    </svg>
  </div>

  <!-- C. 배지 -->
  <div class="card paper"><h2>C. 노선 배지 <small>회전 없음, 역명판의 노선 기호 + 방향 화살</small></h2>
    <svg viewBox="0 0 420 200" data-map>
      <g transform="translate(110 60)"><circle r="10" fill="#1D5FC2" stroke="var(--s)" stroke-width="2"/><circle r="11.5" fill="none" stroke="var(--k)" stroke-width="1.5"/><text x="-3.3" y="4" font-size="11" font-weight="900" fill="#fff">1</text><path d="M14 -4 L19 0 L14 4 Z" fill="var(--k)"/></g>
      <g transform="translate(240 100)"><rect x="-10" y="-10" width="20" height="20" rx="3" fill="#1D5FC2" stroke="var(--s)" stroke-width="2"/><rect x="-11.5" y="-11.5" width="23" height="23" rx="4" fill="none" stroke="var(--k)" stroke-width="1.5"/><text x="-5.6" y="4" font-size="11" font-weight="900" fill="#fff">급</text><path d="M12 12 L17 17 L11 17 Z" fill="var(--k)"/></g>
      <g transform="translate(262 40)"><circle r="10" fill="#1E8A47" stroke="var(--s)" stroke-width="2"/><circle r="11.5" fill="none" stroke="#F2BE00" stroke-width="3"/><text x="-3.3" y="4" font-size="11" font-weight="900" fill="#fff">2</text><path d="M-14 -4 L-19 0 L-14 4 Z" fill="var(--k)"/></g>
      <text class="note" x="10" y="192">일반(원) · 급행(사각+급) · 혼잡(노란 테) — 노선 구분이 가장 쉬움, 방향은 작게</text>
    </svg>
  </div>
</div>

<h1 style="margin-top:18px">먹 테마</h1>
<div class="grid" id="inkCopies"></div>

<script>
  // 각 칸에 공통 지도 배경을 깔고, 먹 테마 복사본을 만든다.
  // 숨긴 SVG의 공통 지도를 각 칸 맨 앞에 복제한다.
  const base = document.querySelector("#map > g");
  document.querySelectorAll("svg[data-map]").forEach((svg) => svg.prepend(base.cloneNode(true)));
  const ink = document.getElementById("inkCopies");
  document.querySelectorAll(".grid:first-of-type .card").forEach((card) => {
    const copy = card.cloneNode(true);
    copy.classList.replace("paper", "ink");
    ink.appendChild(copy);
  });
</script>
</body>
</html>
